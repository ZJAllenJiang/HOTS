name: Prototype checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run check
      - name: Run simulation tests
        run: npm test
      - name: Build browser prototype
        run: npm run build
      - name: Archive browser build
        uses: actions/upload-artifact@v6
        with:
          name: aram-prototype-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
